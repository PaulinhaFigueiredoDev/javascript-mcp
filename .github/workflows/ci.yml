name: Testes

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, closed]
  push:
    branches: [main, develop]

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check src/index.mjs
      - name: Validar titulo do PR
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no -- commitlint
      - name: Validar commits do PR para develop
        if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.base.ref == 'develop'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no -- commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  preparar-promocao:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: preparar-promocao-develop
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Atualizar versao patch e verificar o codigo
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! git merge-base --is-ancestor "$MERGE_SHA" HEAD; then
            echo "O commit de merge do PR nao esta em develop."
            exit 1
          fi

          if [ -n "$(git log -1 --format=%s --fixed-strings --grep="(PR #${PR_NUMBER})" "${MERGE_SHA}..HEAD")" ]; then
            echo "A versao deste PR ja foi atualizada."
            exit 0
          fi

          primeiro_commit=$(git rev-list --ancestry-path --reverse "${MERGE_SHA}..HEAD" | sed -n '1p')
          if [ -n "$primeiro_commit" ] && git show -s --format=%s "$primeiro_commit" | grep -q '^chore: atualiza versao para v'; then
            echo "A versao deste PR ja foi atualizada por um commit anterior."
            exit 0
          fi

          npm ci
          npm version patch --no-git-tag-version
          npm test
          node --check src/index.mjs
          versao=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: atualiza versao para v${versao} (PR #${PR_NUMBER})"
          git push origin HEAD:develop
      - name: Abrir PR de develop para main, se necessario
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')" ]; then
            echo 'Ja existe um PR aberto de develop para main.'
            exit 0
          fi
          gh pr create \
            --base main \
            --head develop \
            --title "chore(release): promove develop para main" \
            --body "Versao patch atualizada em package.json apos merge em develop e testes aprovados. Revise e teste no MCP Inspector antes do merge em main."
